{{/* Custom Styles for Shortcodes and Components */}}
{{/* Minimal Terracotta Color Palette */}}

{{/* Google Fonts - Inter for professional typography */}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --tc-primary: #a3877e;
    --tc-secondary: #cbbab3;
    --tc-light: #e8ddd8;
    --tc-bg: #faf8f6;
    --tc-text: #5c5250;
    --tc-text-light: #8a7f7a;
    --tc-border: #e0d6d0;
    --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* ===== Custom Typography (3.a) ===== */
  body, html {
    font-family: var(--font-family) !important;
    line-height: 1.7;
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-family) !important;
    font-weight: 600;
  }
  p, li, a, span, div {
    font-family: var(--font-family) !important;
  }

  /* ===== Page Width - 90% viewport, max 1400px ===== */
  .universal-wrapper,
  .container,
  .page-wrapper > .container,
  main > .container,
  .hb-section > .container {
    max-width: min(90vw, 1400px) !important;
    width: 90vw !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  
  /* Even wider on large screens */
  @media (min-width: 1600px) {
    .universal-wrapper,
    .container,
    .page-wrapper > .container,
    main > .container,
    .hb-section > .container {
      max-width: 1600px !important;
      width: 85vw !important;
    }
  }

  /* Experience Item Shortcode Styles */
  .experience-item {
    margin-bottom: 2rem;
  }
  
  .experience-header {
    margin-bottom: 1rem;
  }
  
  .experience-title {
    margin-bottom: 0.25rem;
  }
  
  .experience-company {
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  
  .experience-location {
    font-style: italic;
    margin-bottom: 0.25rem;
  }
  
  .experience-date {
    color: var(--tc-primary);
    font-size: 0.9rem;
  }
  
  /* Featured Image Shortcode Styles */
  figure.featured-image {
    margin: 1.5rem 0;
  }
  
  figure.featured-image img {
    border-radius: 6px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  
  figure.featured-image figcaption {
    margin-top: 0.75rem;
    text-align: center;
    font-size: 0.9rem;
    color: rgba(0,0,0,0.6);
  }
  
  .dark figure.featured-image figcaption {
    color: rgba(255,255,255,0.7);
  }
  
  figure.featured-image .image-credit {
    font-size: 0.8rem;
    font-style: italic;
  }
  
  /* Publication Links Shortcode Styles */
  .publication-links {
    margin-top: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  /* ===== Common Page Section Styles ===== */
  
  /* Header Section - Minimal pale background */
  .header-section {
    background: var(--tc-bg);
    color: var(--tc-text);
    padding: 2.5rem;
    border-radius: 0.5rem;
    margin-bottom: 2rem;
    text-align: center;
    border: 1px solid var(--tc-border);
  }
  .header-section h2, .header-section h3 {
    color: var(--tc-text) !important;
  }

  /* Current Role Card - Highlighted current position */
  .current-role {
    background: var(--tc-bg);
    padding: 2rem;
    border-radius: 0.5rem;
    border-left: 3px solid var(--tc-primary);
    margin-bottom: 1.5rem;
  }
  .current-role h3 {
    color: var(--tc-text);
    font-size: 1.4rem;
    margin-bottom: 0.5rem;
  }
  .current-role strong {
    color: var(--tc-primary);
  }
  .current-role strong a {
    color: var(--tc-primary);
    text-decoration: none;
  }

  /* Experience Card - Standard job entries */
  .experience-card {
    background: white;
    padding: 2rem;
    border-radius: 0.5rem;
    margin-bottom: 1.5rem;
    border-left: 2px solid var(--tc-border);
  }
  .experience-card:hover {
    border-left-color: var(--tc-primary);
  }
  .experience-card h3 {
    color: var(--tc-text);
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
  }
  .experience-card strong {
    color: var(--tc-primary);
  }

  /* Academic Card - Research/education entries */
  .academic-card {
    background: var(--tc-bg);
    padding: 2rem;
    border-radius: 0.5rem;
    margin-bottom: 1.5rem;
    border-left: 2px solid var(--tc-secondary);
  }
  .academic-card:hover {
    border-left-color: var(--tc-primary);
  }
  .academic-card h3 {
    color: var(--tc-text);
    font-size: 1.3rem;
  }
  .academic-card strong {
    color: var(--tc-primary);
  }

  /* Career Summary - Stats banner */
  .career-summary {
    background: var(--tc-light);
    color: var(--tc-text);
    padding: 2rem;
    border-radius: 0.5rem;
    text-align: center;
    margin-top: 2rem;
    border: 1px solid var(--tc-border);
  }
  .career-summary h2 {
    color: var(--tc-text) !important;
  }
  .career-summary p {
    font-size: 1.2rem;
    font-weight: 500;
  }
  .career-summary strong {
    font-size: 1.4rem;
    color: var(--tc-primary);
  }

  /* Patents Section */
  .patents-section {
    background: var(--tc-bg);
    padding: 2rem;
    border-radius: 0.5rem;
    border-left: 2px solid var(--tc-primary);
  }
  .patent-list h3 {
    color: var(--tc-text);
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
  }
  .patent-list strong {
    color: var(--tc-primary);
  }
  .patent-list hr {
    margin: 2rem 0;
    border-color: var(--tc-border);
  }

  /* Publication List */
  .publication-list h3 {
    color: var(--tc-text);
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
    line-height: 1.4;
  }
  .publication-list strong {
    color: var(--tc-primary);
  }
  .publication-list em {
    color: var(--tc-text-light);
  }
  .publication-list hr {
    margin: 2rem 0;
    border-color: var(--tc-border);
  }

  /* Conference List */
  .conference-list h3 {
    color: var(--tc-text);
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
    line-height: 1.4;
  }
  .conference-list strong {
    color: var(--tc-primary);
  }
  .conference-list em {
    color: var(--tc-text-light);
  }
  .conference-list hr {
    margin: 2rem 0;
    border-color: var(--tc-border);
  }

  /* Impact Section with Metrics */
  .impact-section {
    background: var(--tc-bg);
    padding: 2rem;
    border-radius: 0.5rem;
  }
  .impact-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    margin: 2rem 0;
  }
  .metric-card {
    background: white;
    padding: 1.5rem;
    border-radius: 0.5rem;
    text-align: center;
    border-top: 2px solid var(--tc-primary);
  }
  .metric-number {
    font-size: 2.5rem;
    font-weight: bold;
    color: var(--tc-primary);
    margin-bottom: 0.5rem;
  }
  .metric-label {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--tc-text);
    margin-bottom: 0.5rem;
  }
  .metric-detail {
    font-size: 0.9rem;
    color: var(--tc-text-light);
  }
  .impact-section h3 {
    color: var(--tc-text);
    margin-top: 2rem;
  }
  .impact-section ul {
    list-style: none;
    padding-left: 0;
  }
  .impact-section ul li {
    margin-bottom: 0.8rem;
    padding-left: 1.5rem;
    position: relative;
  }

  /* Contact Section */
  .contact-section {
    background: var(--tc-bg);
    padding: 3rem;
    border-radius: 0.5rem;
    border: 1px solid var(--tc-border);
  }
  .contact-section h3 {
    color: var(--tc-text);
  }

  /* Intro Section - Homepage hero */
  .intro-section {
    background: var(--tc-bg);
    color: var(--tc-text);
    padding: 3rem;
    border-radius: 0.5rem;
    margin-bottom: 3rem;
    border: 1px solid var(--tc-border);
  }
  .intro-section h2, .intro-section h3 {
    color: var(--tc-text) !important;
  }
  /* Image displays normally - no filter */

  /* CTA Button Styles */
  .cta-button {
    display: inline-block;
    background: var(--tc-primary);
    color: white !important;
    padding: 1rem 2rem;
    border-radius: 0.25rem;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    transition: all 0.2s ease;
    margin-top: 1rem;
  }
  .cta-button:hover {
    background: var(--tc-text);
    color: white !important;
  }
  .cta-button-secondary {
    display: inline-block;
    background: white;
    color: var(--tc-primary) !important;
    padding: 0.75rem 1.5rem;
    border-radius: 0.25rem;
    text-decoration: none;
    font-weight: 600;
    border: 1px solid var(--tc-primary);
    transition: all 0.2s ease;
    margin: 0.5rem;
  }
  .cta-button-secondary:hover {
    background: var(--tc-primary);
    color: white !important;
  }
  .cta-container {
    text-align: center;
    margin-top: 2rem;
  }

  /* Dark mode adjustments */
  .dark {
    --tc-primary: #c4a89e;
    --tc-secondary: #a89590;
    --tc-light: #3a3432;
    --tc-bg: #2a2624;
    --tc-text: #e8e2df;
    --tc-text-light: #a9a09b;
    --tc-border: #4a4240;
  }
  .dark .experience-card {
    background: #2a2624;
    border-left-color: #4a4240;
  }
  .dark .experience-card:hover {
    border-left-color: var(--tc-primary);
  }
  .dark .experience-card h3 {
    color: var(--tc-text);
  }
  .dark .academic-card {
    background: #2a2624;
  }
  .dark .academic-card h3 {
    color: var(--tc-text);
  }
  .dark .header-section,
  .dark .intro-section,
  .dark .career-summary,
  .dark .patents-section,
  .dark .impact-section,
  .dark .contact-section {
    background: #2a2624;
    border-color: #4a4240;
  }
  .dark .current-role {
    background: #2a2624;
  }
  .dark .metric-card {
    background: #3a3432;
  }
  .dark .metric-label {
    color: var(--tc-text);
  }

  /* Publication page styling */
  .section-pub-list .pub-list-item {
    padding: 1rem 0;
    border-bottom: 1px solid var(--tc-border);
  }
  .section-pub-list .pub-list-item:last-child {
    border-bottom: none;
  }
  .section-pub-list .article-metadata {
    color: var(--tc-text-light);
  }
  .section-pub-list a {
    color: var(--tc-primary);
  }
  .section-pub-list a:hover {
    color: var(--tc-text);
  }
  .btn-outline-primary {
    color: var(--tc-primary) !important;
    border-color: var(--tc-primary) !important;
  }
  .btn-outline-primary:hover {
    background: var(--tc-primary) !important;
    color: white !important;
  }

  /* ===== Company Logos / Names for Social Proof ===== */
  .company-logos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem 0;
    font-size: 1.1rem;
  }
  .company-logos a {
    font-weight: 600;
    color: var(--tc-text);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .company-logos a:hover {
    color: var(--tc-primary);
  }
  .logo-separator {
    color: var(--tc-text-light);
    margin: 0 0.25rem;
  }
  
  /* Logo Grid (for when actual logo images are added) */
  .logo-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 2rem 3rem;
    padding: 1.5rem 0;
  }
  .logo-grid a {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .logo-grid a:hover {
    opacity: 0.8;
  }
  .logo-grid img {
    max-height: 40px;
    width: auto;
    filter: grayscale(100%);
    opacity: 0.7;
    transition: all 0.2s ease;
  }
  .logo-grid a:hover img {
    filter: grayscale(0%);
    opacity: 1;
  }
  
  /* Social proof section */
  .social-proof-section {
    text-align: center;
    padding: 1rem 0;
  }
  .social-proof-section p {
    margin-bottom: 0.5rem;
  }
  
  /* Stats badges */
  .stats-badges {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1.5rem;
  }
  .stats-badge {
    background: var(--tc-bg);
    border: 1px solid var(--tc-border);
    padding: 0.5rem 1rem;
    border-radius: 2rem;
    font-size: 0.9rem;
    color: var(--tc-text);
  }
  .stats-badge strong {
    color: var(--tc-primary);
  }

  /* Services grid */
  .services-grid hr {
    border-color: var(--tc-border);
    margin: 2rem 0;
  }
  .services-grid h3 {
    color: var(--tc-text);
    margin-bottom: 1rem;
  }

  /* Results section */
  .results-section {
    line-height: 1.8;
  }
  .results-section strong {
    color: var(--tc-primary);
  }

  /* Process section */
  .process-section {
    line-height: 2;
  }
  .process-section strong {
    color: var(--tc-primary);
  }

  /* Engagement models */
  .engagement-models hr {
    border-color: var(--tc-border);
    margin: 1.5rem 0;
  }
  .engagement-models h3 {
    color: var(--tc-text);
    margin-bottom: 0.5rem;
  }

  /* ===== Visual Hierarchy Improvements (1.a-d) ===== */

  /* Consistent section spacing (1.c) */
  .hb-section {
    padding: 4rem 0 !important;
  }
  .hb-section:first-child {
    padding-top: 2rem !important;
  }

  /* Services Grid - Card Layout (1.a) */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.5rem;
    margin: 1rem 0;
  }
  .services-grid hr {
    display: none;
  }
  .service-card {
    background: var(--tc-bg);
    border: 1px solid var(--tc-border);
    border-radius: 0.75rem;
    padding: 2rem;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .service-card:hover {
    border-color: var(--tc-primary);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .service-card h3 {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1rem;
    font-size: 1.25rem;
  }
  .service-card .service-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
  }
  .service-card .service-icon svg {
    width: 100%;
    height: 100%;
    color: var(--tc-primary);
  }
  .service-card p {
    color: var(--tc-text-light);
    line-height: 1.7;
  }

  /* Engagement Models - Card Layout (1.b) */
  .engagement-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
    margin: 1.5rem 0;
  }
  .engagement-card {
    background: white;
    border: 1px solid var(--tc-border);
    border-radius: 0.75rem;
    padding: 1.75rem;
    text-align: center;
    transition: all 0.3s ease;
  }
  .engagement-card:hover {
    border-color: var(--tc-primary);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .engagement-card .engagement-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 1rem;
    color: var(--tc-primary);
  }
  .engagement-card h3 {
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    color: var(--tc-text);
  }
  .engagement-card p {
    color: var(--tc-text-light);
    font-size: 0.95rem;
    margin-bottom: 0.75rem;
  }
  .engagement-card .best-for {
    font-size: 0.85rem;
    color: var(--tc-primary);
    font-weight: 500;
  }

  /* ===== Breadcrumbs (2.d) ===== */
  .breadcrumbs {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem 0;
    font-size: 0.9rem;
    color: var(--tc-text-light);
    flex-wrap: wrap;
  }
  .breadcrumbs a {
    color: var(--tc-text-light);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .breadcrumbs a:hover {
    color: var(--tc-primary);
  }
  .breadcrumbs .separator {
    color: var(--tc-border);
  }
  .breadcrumbs .current {
    color: var(--tc-text);
    font-weight: 500;
  }

  /* ===== Section Icons (3.d) ===== */
  .section-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    margin-right: 0.5rem;
    color: var(--tc-primary);
    vertical-align: middle;
  }
  .section-icon svg {
    width: 100%;
    height: 100%;
  }

  /* ===== Company Logo Grid (5.a) ===== */
  .logo-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 2rem 3rem;
    padding: 1.5rem 0;
  }
  .logo-grid a {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.3s ease;
    padding: 0.5rem;
  }
  .logo-grid a:hover {
    transform: scale(1.05);
  }
  .logo-grid img {
    max-height: 36px;
    width: auto;
    filter: grayscale(100%);
    opacity: 0.6;
    transition: all 0.3s ease;
  }
  .logo-grid a:hover img {
    filter: grayscale(0%);
    opacity: 1;
  }
  /* Fallback text logos when images not available */
  .logo-grid .text-logo {
    font-weight: 600;
    font-size: 1rem;
    color: var(--tc-text-light);
    opacity: 0.7;
    transition: all 0.3s ease;
    padding: 0.5rem 1rem;
    border: 1px solid transparent;
    border-radius: 0.5rem;
  }
  .logo-grid a:hover .text-logo {
    color: var(--tc-primary);
    opacity: 1;
    border-color: var(--tc-border);
    background: var(--tc-bg);
  }

  /* ===== Newsletter Signup (10.d) ===== */
  .newsletter-section {
    background: var(--tc-bg);
    border: 1px solid var(--tc-border);
    border-radius: 0.75rem;
    padding: 2.5rem;
    text-align: center;
    margin: 2rem 0;
  }
  .newsletter-section h3 {
    font-size: 1.5rem;
    margin-bottom: 0.5rem;
    color: var(--tc-text);
  }
  .newsletter-section p {
    color: var(--tc-text-light);
    margin-bottom: 1.5rem;
  }
  .newsletter-section iframe {
    border-radius: 8px;
  }

  /* ===== Enhanced Footer (12.a, 12.c) ===== */
  .site-footer {
    background: var(--tc-bg) !important;
    border-top: 1px solid var(--tc-border);
    padding: 3rem 0 2rem !important;
  }
  .footer-content {
    max-width: min(90vw, 1400px);
    margin: 0 auto;
    padding: 0 1rem;
  }
  .footer-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 2rem;
    margin-bottom: 2rem;
  }
  .footer-section h4 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--tc-text);
    margin-bottom: 1rem;
    font-weight: 600;
  }
  .footer-section ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .footer-section ul li {
    margin-bottom: 0.5rem;
  }
  .footer-section ul li a {
    color: var(--tc-text-light);
    text-decoration: none;
    font-size: 0.95rem;
    transition: color 0.2s ease;
  }
  .footer-section ul li a:hover {
    color: var(--tc-primary);
  }
  .footer-bottom {
    border-top: 1px solid var(--tc-border);
    padding-top: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .footer-copyright {
    color: var(--tc-text-light);
    font-size: 0.85rem;
  }

  /* Social Links (12.c) */
  .social-links {
    display: flex;
    gap: 1rem;
    align-items: center;
  }
  .social-links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: white;
    border: 1px solid var(--tc-border);
    color: var(--tc-text-light);
    transition: all 0.2s ease;
  }
  .social-links a:hover {
    background: var(--tc-primary);
    border-color: var(--tc-primary);
    color: white;
  }
  .social-links svg {
    width: 18px;
    height: 18px;
  }

  /* Header social links */
  .header-social-links {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-left: 1rem;
