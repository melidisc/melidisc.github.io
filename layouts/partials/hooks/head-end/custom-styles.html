{{/* Modern Redesign - Sleek, conversion-focused design */}}
{{/* Inspired by Ada.cx: bold gradients, clean typography, strong CTAs */}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ===== MODERN COLOR SYSTEM ===== */
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #818cf8;
    --accent: #06b6d4;
    --accent-light: #22d3ee;
    --gradient-start: #6366f1;
    --gradient-end: #06b6d4;
    --gradient: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
    --gradient-text: linear-gradient(135deg, #6366f1, #06b6d4);
    --dark: #0f172a;
    --dark-secondary: #1e293b;
    --dark-card: #1a2332;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --bg-white: #ffffff;
    --bg-light: #f8fafc;
    --bg-subtle: #f1f5f9;
    --border-light: #e2e8f0;
    --border-subtle: #f1f5f9;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    --radius-sm: 0.5rem;
    --radius-md: 0.75rem;
    --radius-lg: 1rem;
    --radius-xl: 1.5rem;
  }

  /* ===== GLOBAL RESET & BASE ===== */
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
    color: var(--text-primary);
    background: var(--bg-white);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }

  p {
    line-height: 1.7;
    color: var(--text-secondary);
  }

  a {
    transition: all 0.2s ease;
  }

  /* ===== PAGE WIDTH ===== */
  .universal-wrapper,
  .container,
  .page-wrapper > .container,
  main > .container,
  .hb-section > .container {
    max-width: min(90vw, 1200px) !important;
    width: 90vw !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  @media (min-width: 1600px) {
    .universal-wrapper,
    .container,
    .page-wrapper > .container,
    main > .container,
    .hb-section > .container {
      max-width: 1200px !important;
      width: 85vw !important;
    }
  }

  /* ===== NAVBAR - Clean & Minimal ===== */
  .navbar {
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.85) !important;
    border-bottom: 1px solid var(--border-light);
    box-shadow: none !important;
  }

  .navbar-brand {
    font-weight: 700 !important;
    font-size: 1.1rem !important;
    color: var(--text-primary) !important;
    letter-spacing: -0.01em;
  }

  .navbar .nav-link {
    font-weight: 500 !important;
    font-size: 0.9rem !important;
    color: var(--text-secondary) !important;
    transition: color 0.2s ease !important;
  }

  .navbar .nav-link:hover {
    color: var(--primary) !important;
  }

  /* ===== HERO SECTION ===== */
  .hero-section {
    background: var(--dark);
    color: white;
    padding: 6rem 2rem 5rem;
    border-radius: 0;
    margin: 0;
    border: none;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  .hero-section::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
    animation: heroGlow 8s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes heroGlow {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-2%, 2%); }
  }

  .hero-section * {
    position: relative;
    z-index: 1;
  }

  .hero-section h2 {
    color: white !important;
    font-size: clamp(2.5rem, 5vw, 4rem) !important;
    font-weight: 800 !important;
    line-height: 1.1 !important;
    letter-spacing: -0.03em !important;
    margin-bottom: 1.5rem !important;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-section p,
  .hero-section .hero-subtitle {
    color: rgba(255, 255, 255, 0.7) !important;
    font-size: clamp(1.1rem, 2vw, 1.35rem) !important;
    line-height: 1.6 !important;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 2rem;
  }

  .hero-section img {
    max-width: 220px !important;
    margin-bottom: 2rem;
    filter: brightness(0) invert(1);
    opacity: 0.9;
  }

  .gradient-text {
    background: var(--gradient-text);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ===== CTA BUTTONS ===== */
  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--gradient) !important;
    color: white !important;
    padding: 0.875rem 2rem;
    border-radius: 50px;
    text-decoration: none !important;
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    border: none;
    cursor: pointer;
    letter-spacing: -0.01em;
  }

  .cta-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
    color: white !important;
  }

  .cta-button-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: transparent;
    color: var(--primary) !important;
    padding: 0.75rem 1.5rem;
    border-radius: 50px;
    text-decoration: none !important;
    font-weight: 600;
    font-size: 0.95rem;
    border: 2px solid var(--primary);
    transition: all 0.3s ease;
    cursor: pointer;
    margin: 0.35rem;
  }

  .cta-button-secondary:hover {
    background: var(--primary);
    color: white !important;
    transform: translateY(-1px);
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
  }

  .cta-button-white {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: white !important;
    color: var(--dark) !important;
    padding: 0.875rem 2rem;
    border-radius: 50px;
    text-decoration: none !important;
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    border: none;
    cursor: pointer;
  }

  .cta-button-white:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    color: var(--dark) !important;
  }

  .cta-button-outline-white {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: transparent !important;
    color: white !important;
    padding: 0.75rem 1.75rem;
    border-radius: 50px;
    text-decoration: none !important;
    font-weight: 600;
    font-size: 0.95rem;
    border: 2px solid rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .cta-button-outline-white:hover {
    border-color: white;
    background: rgba(255, 255, 255, 0.1) !important;
    color: white !important;
    transform: translateY(-1px);
  }

  .cta-container {
    text-align: center;
    margin-top: 2rem;
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  /* ===== SOCIAL PROOF SECTION ===== */
  .social-proof-strip {
    text-align: center;
    padding: 3rem 0;
    background: var(--bg-white);
    border-bottom: 1px solid var(--border-light);
  }

  .social-proof-strip .proof-label {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 1.25rem;
  }

  .company-logos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0;
  }

  .company-logos a {
    font-weight: 600;
    font-size: 1rem;
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s ease;
    opacity: 0.7;
  }

  .company-logos a:hover {
    color: var(--primary);
    opacity: 1;
  }

  .logo-separator {
    color: var(--border-light);
    margin: 0 0.15rem;
    font-size: 1.2rem;
  }

  /* ===== STATS BAR ===== */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    flex-wrap: wrap;
    padding: 2.5rem 0;
    background: var(--bg-light);
    border-bottom: 1px solid var(--border-light);
  }

  .stat-item {
    text-align: center;
    padding: 0.5rem 1.5rem;
  }

  .stat-number {
    font-size: 2.5rem;
    font-weight: 800;
    background: var(--gradient-text);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-top: 0.25rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ===== STATS BADGES (inline) ===== */
  .stats-badges {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 1.5rem;
  }

  .stats-badge {
    background: var(--bg-light);
    border: 1px solid var(--border-light);
    padding: 0.5rem 1.25rem;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .stats-badge strong {
    color: var(--primary);
    font-weight: 700;
  }

  /* ===== SECTION HEADERS ===== */
  .section-header {
    text-align: center;
    margin-bottom: 3.5rem;
  }

  .section-header .section-tag {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--primary);
    background: rgba(99, 102, 241, 0.08);
    padding: 0.4rem 1rem;
    border-radius: 50px;
    margin-bottom: 1rem;
  }

  .section-header h2 {
    font-size: clamp(2rem, 3.5vw, 2.75rem) !important;
    font-weight: 800 !important;
    color: var(--text-primary) !important;
    margin-bottom: 1rem !important;
    letter-spacing: -0.02em !important;
    line-height: 1.15 !important;
  }

  .section-header p {
    font-size: 1.15rem;
    color: var(--text-secondary);
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
  }

  /* ===== SERVICES GRID ===== */
  .services-grid-modern {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 1.5rem;
    margin-top: 2rem;
  }

  .service-card {
    background: var(--bg-white);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 2rem;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--gradient);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .service-card:hover {
    border-color: rgba(99, 102, 241, 0.2);
    box-shadow: var(--shadow-lg);
    transform: translateY(-4px);
  }

  .service-card:hover::before {
    opacity: 1;
  }

  .service-card .card-icon {
    font-size: 2rem;
    margin-bottom: 1rem;
    display: block;
  }

  .service-card h3 {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.75rem;
  }

  .service-card p {
    color: var(--text-secondary);
    font-size: 0.95rem;
    line-height: 1.6;
    margin-bottom: 0;
  }

  .service-card .card-link {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    color: var(--primary);
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    margin-top: 1rem;
    transition: gap 0.2s ease;
  }

  .service-card .card-link:hover {
    gap: 0.5rem;
  }

  /* ===== RESULTS / PROOF SECTION ===== */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 2rem;
    margin-top: 2rem;
  }

  .result-card {
    background: var(--bg-light);
    border-radius: var(--radius-lg);
    padding: 2rem;
    position: relative;
  }

  .result-card .result-metric {
    font-size: 2rem;
    font-weight: 800;
    background: var(--gradient-text);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
    line-height: 1;
  }

  .result-card h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
  }

  .result-card p {
    font-size: 0.9rem;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .result-card .result-company {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem;
  }

  /* ===== PROCESS / HOW IT WORKS ===== */
  .process-steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
    margin-top: 2rem;
    counter-reset: step;
  }

  .process-step {
    background: var(--bg-white);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);
    padding: 2rem;
    text-align: center;
    position: relative;
    counter-increment: step;
  }

  .process-step::before {
    content: counter(step);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--gradient);
    color: white;
    font-weight: 700;
    font-size: 1rem;
    margin: 0 auto 1.25rem;
  }

  .process-step h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
  }

  .process-step p {
    font-size: 0.9rem;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  /* ===== FINAL CTA SECTION ===== */
  .cta-section {
    background: var(--dark);
    color: white;
    padding: 5rem 2rem;
    border-radius: var(--radius-xl);
    text-align: center;
    position: relative;
    overflow: hidden;
    margin: 3rem 0;
  }

  .cta-section::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 40% 40%, rgba(99, 102, 241, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse at 60% 60%, rgba(6, 182, 212, 0.15) 0%, transparent 60%);
    pointer-events: none;
  }

  .cta-section * {
    position: relative;
    z-index: 1;
  }

  .cta-section h2 {
    color: white !important;
    font-size: clamp(2rem, 4vw, 3rem) !important;
    font-weight: 800 !important;
    margin-bottom: 1rem !important;
    letter-spacing: -0.02em !important;
  }

  .cta-section p {
    color: rgba(255, 255, 255, 0.7) !important;
    font-size: 1.15rem;
    max-width: 500px;
    margin: 0 auto 2rem;
    line-height: 1.6;
  }

  .cta-section .cta-links {
    color: rgba(255, 255, 255, 0.5);
    margin-top: 2rem;
    font-size: 0.9rem;
  }

  .cta-section .cta-links a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .cta-section .cta-links a:hover {
    color: white;
  }

  /* ===== CONTACT SECTION (override for block) ===== */
  .contact-section {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
  }

  /* ===== INTRO SECTION (override for hero block) ===== */
  .intro-section {
    background: var(--dark) !important;
    border: none !important;
    border-radius: 0 !important;
    margin-bottom: 0 !important;
  }

  /* ===== HEADER SECTION ===== */
  .header-section {
    background: var(--bg-light);
    color: var(--text-primary);
    padding: 3rem;
    border-radius: var(--radius-lg);
    margin-bottom: 2rem;
    text-align: center;
    border: 1px solid var(--border-light);
  }

  .header-section h2, .header-section h3 {
    color: var(--text-primary) !important;
  }

  /* ===== EXPERIENCE CARDS ===== */
  .experience-card {
    background: var(--bg-white);
    padding: 2rem;
    border-radius: var(--radius-lg);
    margin-bottom: 1.5rem;
    border: 1px solid var(--border-light);
    border-left: 3px solid var(--border-light);
    transition: all 0.3s ease;
  }

  .experience-card:hover {
    border-left-color: var(--primary);
    box-shadow: var(--shadow-md);
  }

  .experience-card h3 {
    color: var(--text-primary);
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
  }

  .experience-card strong {
    color: var(--primary);
  }

  .experience-card strong a {
    color: var(--primary);
    text-decoration: none;
  }

  .experience-card strong a:hover {
    text-decoration: underline;
  }

  /* Current Role */
  .current-role {
    background: var(--bg-white);
    padding: 2rem;
    border-radius: var(--radius-lg);
    border-left: 3px solid var(--primary);
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow-sm);
  }

  .current-role h3 {
    color: var(--text-primary);
    font-size: 1.4rem;
    margin-bottom: 0.5rem;
  }

  .current-role strong {
    color: var(--primary);
  }

  .current-role strong a {
    color: var(--primary);
    text-decoration: none;
  }

  /* Academic Card */
  .academic-card {
    background: var(--bg-light);
    padding: 2rem;
    border-radius: var(--radius-lg);
    margin-bottom: 1.5rem;
    border-left: 3px solid var(--accent);
  }

  .academic-card:hover {
    border-left-color: var(--primary);
  }

  .academic-card h3 {
    color: var(--text-primary);
    font-size: 1.3rem;
  }

  .academic-card strong {
    color: var(--primary);
  }

  /* Career Summary */
  .career-summary {
    background: var(--bg-light);
    color: var(--text-primary);
    padding: 2.5rem;
    border-radius: var(--radius-lg);
    text-align: center;
    margin-top: 2rem;
    border: 1px solid var(--border-light);
  }

  .career-summary h2 {
    color: var(--text-primary) !important;
  }

  .career-summary p {
    font-size: 1.2rem;
    font-weight: 500;
  }

  .career-summary strong {
    font-size: 1.4rem;
    background: var(--gradient-text);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ===== PATENTS & PUBLICATIONS ===== */
  .patents-section {
    background: var(--bg-light);
    padding: 2rem;
    border-radius: var(--radius-lg);
    border-left: 3px solid var(--primary);
  }

  .patent-list h3 {
    color: var(--text-primary);
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
  }

  .patent-list strong {
    color: var(--primary);
  }

  .patent-list hr {
    margin: 2rem 0;
    border-color: var(--border-light);
  }

  .publication-list h3 {
    color: var(--text-primary);
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
    line-height: 1.4;
  }

  .publication-list strong {
    color: var(--primary);
  }

  .publication-list em {
    color: var(--text-muted);
  }

  .publication-list hr,
  .conference-list hr {
    margin: 2rem 0;
    border-color: var(--border-light);
  }

  .conference-list h3 {
    color: var(--text-primary);
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
    line-height: 1.4;
  }

  .conference-list strong {
    color: var(--primary);
  }

  .conference-list em {
    color: var(--text-muted);
  }

  /* ===== IMPACT METRICS ===== */
  .impact-section {
    background: var(--bg-light);
    padding: 2.5rem;
    border-radius: var(--radius-lg);
  }

  .impact-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
