{{/* Custom Styles for Shortcodes and Components */}}
{{/* Ink + Electric Blue Palette: precise, credible, quietly futuristic */}}
<style>
  :root {
    --tc-primary: #2563eb;
    --tc-secondary: #0891b2;
    --tc-light: #eef4ff;
    --tc-bg: #f6f8fb;
    --tc-text: #0f172a;
    --tc-text-light: #52607a;
    --tc-border: #e1e7f0;
    --tc-mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --tc-glow: 0 0 0 1px rgba(37, 99, 235, 0.16), 0 8px 24px -8px rgba(37, 99, 235, 0.35);
    --tc-grid: radial-gradient(rgba(15, 23, 42, 0.06) 1px, transparent 1px);
  }

  .dark {
    --tc-primary: #60a5fa;
    --tc-secondary: #22d3ee;
    --tc-light: #111a2e;
    --tc-bg: #0a0f1c;
    --tc-text: #e7ecf6;
    --tc-text-light: #8b96ad;
    --tc-border: #1e293f;
    --tc-glow: 0 0 0 1px rgba(96, 165, 250, 0.25), 0 8px 28px -6px rgba(96, 165, 250, 0.45);
    --tc-grid: radial-gradient(rgba(148, 163, 184, 0.12) 1px, transparent 1px);
  }

  /* Data-readout style for numbers/stats: monospace, tracked-out, quietly technical */
  .metric-number,
  .stats-badge strong,
  .career-summary strong,
  .experience-date {
    font-family: var(--tc-mono);
    letter-spacing: -0.02em;
  }

  /* Subtle dot-grid texture on hero/header panels for a technical, mapped-out feel */
  .header-section,
  .intro-section {
    background-image: var(--tc-grid);
    background-size: 20px 20px;
  }

  /* ===== Page Width - 90% viewport, max 1400px ===== */
  .universal-wrapper,
  .container,
  .page-wrapper > .container,
  main > .container,
  .hb-section > .container {
    max-width: min(90vw, 1400px) !important;
    width: 90vw !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }
  
  /* Even wider on large screens */
  @media (min-width: 1600px) {
    .universal-wrapper,
    .container,
    .page-wrapper > .container,
    main > .container,
    .hb-section > .container {
      max-width: 1600px !important;
      width: 85vw !important;
    }
  }

  /* Experience Item Shortcode Styles */
  .experience-item {
    margin-bottom: 2rem;
  }
  
  .experience-header {
    margin-bottom: 1rem;
  }
  
  .experience-title {
    margin-bottom: 0.25rem;
  }
  
  .experience-company {
    font-weight: 500;
    margin-bottom: 0.25rem;
  }
  
  .experience-location {
    font-style: italic;
    margin-bottom: 0.25rem;
  }
  
  .experience-date {
    color: var(--tc-primary);
    font-size: 0.9rem;
  }
  
  /* Featured Image Shortcode Styles */
  figure.featured-image {
    margin: 1.5rem 0;
  }
  
  figure.featured-image img {
    border-radius: 6px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  
  figure.featured-image figcaption {
    margin-top: 0.75rem;
    text-align: center;
    font-size: 0.9rem;
    color: rgba(0,0,0,0.6);
  }
  
  .dark figure.featured-image figcaption {
    color: rgba(255,255,255,0.7);
  }
  
  figure.featured-image .image-credit {
    font-size: 0.8rem;
    font-style: italic;
  }
  
  /* Publication Links Shortcode Styles */
  .publication-links {
    margin-top: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  /* ===== Common Page Section Styles ===== */
  
  /* Header Section - Minimal pale background */
  .header-section {
    background: var(--tc-bg);
    color: var(--tc-text);
    padding: 2.5rem;
    border-radius: 0.5rem;
    margin-bottom: 2rem;
    text-align: center;
    border: 1px solid var(--tc-border);
  }
  .header-section h2, .header-section h3 {
    color: var(--tc-text) !important;
  }

  /* Current Role Card - Highlighted current position */
  .current-role {
    background: var(--tc-bg);
    padding: 2rem;
    border-radius: 0.5rem;
    border-left: 3px solid var(--tc-primary);
    margin-bottom: 1.5rem;
  }
  .current-role h3 {
    color: var(--tc-text);
    font-size: 1.4rem;
    margin-bottom: 0.5rem;
  }
  .current-role strong {
    color: var(--tc-primary);
  }
  .current-role strong a {
    color: var(--tc-primary);
    text-decoration: none;
  }

  /* Experience Card - Standard job entries */
  .experience-card {
    background: white;
    padding: 2rem;
    border-radius: 0.5rem;
    margin-bottom: 1.5rem;
    border-left: 2px solid var(--tc-border);
  }
  .experience-card:hover {
    border-left-color: var(--tc-primary);
  }
  .experience-card h3 {
    color: var(--tc-text);
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
  }
  .experience-card strong {
    color: var(--tc-primary);
  }

  /* Academic Card - Research/education entries */
  .academic-card {
    background: var(--tc-bg);
    padding: 2rem;
    border-radius: 0.5rem;
    margin-bottom: 1.5rem;
    border-left: 2px solid var(--tc-secondary);
  }
  .academic-card:hover {
    border-left-color: var(--tc-primary);
  }
  .academic-card h3 {
    color: var(--tc-text);
    font-size: 1.3rem;
  }
  .academic-card strong {
    color: var(--tc-primary);
  }

  /* Career Summary - Stats banner */
  .career-summary {
    background: var(--tc-light);
    color: var(--tc-text);
    padding: 2rem;
    border-radius: 0.5rem;
    text-align: center;
    margin-top: 2rem;
    border: 1px solid var(--tc-border);
  }
  .career-summary h2 {
    color: var(--tc-text) !important;
  }
  .career-summary p {
    font-size: 1.2rem;
    font-weight: 500;
  }
  .career-summary strong {
    font-size: 1.4rem;
    color: var(--tc-primary);
  }

  /* Patents Section */
  .patents-section {
    background: var(--tc-bg);
    padding: 2rem;
    border-radius: 0.5rem;
    border-left: 2px solid var(--tc-primary);
  }
  .patent-list h3 {
    color: var(--tc-text);
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
  }
  .patent-list strong {
    color: var(--tc-primary);
  }
  .patent-list hr {
    margin: 2rem 0;
    border-color: var(--tc-border);
  }

  /* Publication List */
  .publication-list h3 {
    color: var(--tc-text);
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
    line-height: 1.4;
  }
  .publication-list strong {
    color: var(--tc-primary);
  }
  .publication-list em {
    color: var(--tc-text-light);
  }
  .publication-list hr {
    margin: 2rem 0;
    border-color: var(--tc-border);
  }

  /* Conference List */
  .conference-list h3 {
    color: var(--tc-text);
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    margin-top: 1.5rem;
    line-height: 1.4;
  }
  .conference-list strong {
    color: var(--tc-primary);
  }
  .conference-list em {
    color: var(--tc-text-light);
  }
  .conference-list hr {
    margin: 2rem 0;
    border-color: var(--tc-border);
  }

  /* Impact Section with Metrics */
  .impact-section {
    background: var(--tc-bg);
    padding: 2rem;
    border-radius: 0.5rem;
  }
  .impact-metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    margin: 2rem 0;
  }
  .metric-card {
    background: white;
    padding: 1.5rem;
    border-radius: 0.5rem;
    text-align: center;
    border-top: 2px solid var(--tc-primary);
  }
  .metric-number {
    font-size: 2.5rem;
    font-weight: bold;
    color: var(--tc-primary);
    margin-bottom: 0.5rem;
  }
  .metric-label {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--tc-text);
    margin-bottom: 0.5rem;
  }
  .metric-detail {
    font-size: 0.9rem;
    color: var(--tc-text-light);
  }
  .impact-section h3 {
    color: var(--tc-text);
    margin-top: 2rem;
  }
  .impact-section ul {
    list-style: none;
    padding-left: 0;
  }
  .impact-section ul li {
    margin-bottom: 0.8rem;
    padding-left: 1.5rem;
    position: relative;
  }

  /* Contact Section */
  .contact-section {
    background: var(--tc-bg);
    padding: 3rem;
    border-radius: 0.5rem;
    border: 1px solid var(--tc-border);
  }
  .contact-section h3 {
    color: var(--tc-text);
  }

  /* Intro Section - Homepage hero */
  .intro-section {
    background: var(--tc-bg);
    color: var(--tc-text);
    padding: 3rem;
    border-radius: 0.5rem;
    margin-bottom: 3rem;
    border: 1px solid var(--tc-border);
  }
  .intro-section h2, .intro-section h3 {
    color: var(--tc-text) !important;
  }
  /* Image displays normally - no filter */

  /* Hero logo: the artwork is dark-on-transparent, so it disappears against
     the dark-mode background. Give it a permanent light backdrop in dark mode. */
  .dark .hero-logo-wrap {
    display: inline-block;
    background: #ffffff;
    padding: 1.5rem 2rem;
    border-radius: 0.75rem;
  }

  /* CTA Button Styles */
  .cta-button {
    display: inline-block;
    background: var(--tc-primary);
    color: white !important;
    padding: 1rem 2rem;
    border-radius: 0.25rem;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    transition: all 0.2s ease;
    margin-top: 1rem;
  }
  .cta-button:hover {
    background: var(--tc-text);
    color: white !important;
    box-shadow: var(--tc-glow);
  }
  .cta-button-secondary {
    display: inline-block;
    background: transparent;
    color: var(--tc-primary) !important;
    padding: 0.75rem 1.5rem;
    border-radius: 0.25rem;
    text-decoration: none;
    font-weight: 600;
    border: 1px solid var(--tc-primary);
    transition: all 0.2s ease;
    margin: 0.5rem;
  }
  .cta-button-secondary:hover {
    background: var(--tc-primary);
    color: white !important;
    box-shadow: var(--tc-glow);
  }
  .cta-container {
    text-align: center;
    margin-top: 2rem;
  }

  /* Dark mode component overrides (palette itself is defined at the top of this file) */
  .dark .experience-card {
    background: var(--tc-light);
    border-left-color: var(--tc-border);
  }
  .dark .experience-card:hover {
    border-left-color: var(--tc-primary);
  }
  .dark .experience-card h3 {
    color: var(--tc-text);
  }
  .dark .academic-card {
    background: var(--tc-light);
  }
  .dark .academic-card h3 {
    color: var(--tc-text);
  }
  .dark .header-section,
  .dark .intro-section,
  .dark .career-summary,
  .dark .patents-section,
  .dark .impact-section,
  .dark .contact-section {
    background: var(--tc-light);
    border-color: var(--tc-border);
  }
  .dark .current-role {
    background: var(--tc-light);
  }
  .dark .metric-card {
    background: var(--tc-light);
    border: 1px solid var(--tc-border);
  }
  .dark .metric-label {
    color: var(--tc-text);
  }

  /* Publication page styling */
  .section-pub-list .pub-list-item {
    padding: 1rem 0;
    border-bottom: 1px solid var(--tc-border);
  }
  .section-pub-list .pub-list-item:last-child {
    border-bottom: none;
  }
  .section-pub-list .article-metadata {
    color: var(--tc-text-light);
  }
  .section-pub-list a {
    color: var(--tc-primary);
  }
  .section-pub-list a:hover {
    color: var(--tc-text);
  }
  .btn-outline-primary {
    color: var(--tc-primary) !important;
    border-color: var(--tc-primary) !important;
  }
  .btn-outline-primary:hover {
    background: var(--tc-primary) !important;
    color: white !important;
  }

  /* ===== Company Logos / Names for Social Proof ===== */
  .company-logos {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    padding: 1rem 0;
    font-size: 1.1rem;
  }
  .company-logos a {
    font-weight: 600;
    color: var(--tc-text);
    text-decoration: none;
    transition: color 0.2s ease;
  }
  .company-logos a:hover {
    color: var(--tc-primary);
  }
  .logo-separator {
    color: var(--tc-text-light);
    margin: 0 0.25rem;
  }
  
  /* Logo Grid (for when actual logo images are added) */
  .logo-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 2rem 3rem;
    padding: 1.5rem 0;
  }
  .logo-grid a {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .logo-grid a:hover {
    opacity: 0.8;
  }
  .logo-grid img {
    max-height: 40px;
    width: auto;
    filter: grayscale(100%);
    opacity: 0.7;
    transition: all 0.2s ease;
  }
  .logo-grid a:hover img {
    filter: grayscale(0%);
    opacity: 1;
  }
  
  /* Social proof section */
  .social-proof-section {
    text-align: center;
    padding: 1rem 0;
  }
  .social-proof-section p {
    margin-bottom: 0.5rem;
  }
  
  /* Stats badges */
  .stats-badges {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 1.5rem;
  }
  .stats-badge {
    background: var(--tc-light);
    border: 1px solid var(--tc-border);
    padding: 0.5rem 1rem;
    border-radius: 0.375rem;
    font-size: 0.9rem;
    color: var(--tc-text);
  }
  .stats-badge strong {
    color: var(--tc-primary);
  }

  /* Services grid */
  .services-grid hr {
    border-color: var(--tc-border);
    margin: 2rem 0;
  }
  .services-grid h3 {
    color: var(--tc-text);
    margin-bottom: 1rem;
  }

  /* Results section */
  .results-section {
    line-height: 1.8;
  }
  .results-section strong {
    color: var(--tc-primary);
  }

  /* Process section */
  .process-section {
    line-height: 2;
  }
  .process-section strong {
    color: var(--tc-primary);
  }

  /* Engagement models */
  .engagement-models hr {
    border-color: var(--tc-border);
    margin: 1.5rem 0;
  }
  .engagement-models h3 {
    color: var(--tc-text);
    margin-bottom: 0.5rem;
  }
</style>
